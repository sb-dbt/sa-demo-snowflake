version: 2

models:
  - name: stg_tpch_customers
    description: One row per customer from the TPCH source with columns renamed into analytics-friendly field names. This model is the canonical customer staging layer used by customer marts.
    columns:
      - name: customer_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Customer name from the source system.
      - name: address
        description: Mailing address for the customer.
      - name: nation_key
        description: Foreign key to `stg_tpch_nations`.
      - name: phone_number
        description: Phone number for the customer.
      - name: account_balance
        description: Total account balance for the customer.
      - name: market_segment
        description: Market segment assigned to the customer.
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_tpch_line_items
    description: One row per raw TPCH line item with renamed fields and lightweight status normalization. This is the base staging model for item-level revenue and return analysis.
    columns:
      - name: order_item_key
        description: '{{ doc("order_item_key") }}'
        data_tests:
          - unique
          - not_null
      - name: order_key
        description: Foreign key to `stg_tpch_orders`.
      - name: part_key
        description: Foreign key to the ordered part.
      - name: supplier_key
        description: Foreign key to `stg_tpch_suppliers`.
      - name: line_number
        description: '{{ doc("line_number") }}'
      - name: quantity
        description: Number of units included in the line item.
      - name: extended_price
        description: '{{ doc("extended_price") }}'
      - name: discount_percentage
        description: '{{ doc("discount_percentage") }}'
      - name: tax_rate
        description: Tax rate applied to the order item.
      - name: return_flag
        description: '{{ doc("return_flag") }}'
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['returned', 'accepted', 'not_returned']
      - name: is_return
        description: '{{ doc("is_return") }}'
      - name: status_code
        description: Shipment status code for the order item.
        data_tests:
          - accepted_values:
              arguments:
                values: ['returned', 'billed', 'shipped']
      - name: ship_date
        description: '{{ doc("ship_date") }}'
      - name: commit_date
        description: '{{ doc("commit_date") }}'
      - name: receipt_date
        description: '{{ doc("receipt_date") }}'
      - name: ship_instructions
        description: Shipping instructions captured on the line item.
      - name: ship_mode
        description: '{{ doc("ship_mode") }}'
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_tpch_nations
    description: One row per nation, renamed from the TPCH source and used to attach customer and supplier records to geography.
    columns:
      - name: nation_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Nation name.
      - name: region_key
        description: Foreign key to `stg_tpch_regions`.
      - name: comment
        description: Additional commentary from the source.

  - name: stg_tpch_orders
    description: One row per order from the TPCH orders source with renamed columns and order date/time fields standardized for downstream marts.
    columns:
      - name: order_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: customer_key
        description: Foreign key to `stg_tpch_customers`.
      - name: status_code
        description: Status code of the order.
      - name: total_price
        description: Raw total order price from the source.
      - name: order_date
        description: Date the order was placed.
      - name: priority_code
        description: Priority code associated with the order.
      - name: clerk_name
        description: Clerk identifier associated with the order.
      - name: ship_priority
        description: Numeric representation of shipping priority, where zero is the default.
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_tpch_part_suppliers
    description: One row per part and supplier combination from TPCH with a surrogate key added for downstream joins.
    columns:
      - name: part_supplier_key
        description: Surrogate key for the `part_key` and `supplier_key` combination.
        data_tests:
          - unique
          - not_null
      - name: part_key
        description: Foreign key to `stg_tpch_parts`.
      - name: supplier_key
        description: Foreign key to `stg_tpch_suppliers`.
      - name: available_quantity
        description: '{{ doc("available_quantity") }}'
      - name: cost
        description: '{{ doc("cost") }}'
      - name: comment
        description: '{{ doc("comment") }}'
  
  - name: stg_tpch_parts
    description: One row per part from the TPCH source with renamed descriptive attributes used in supplier and product-style analysis.
    columns:
      - name: part_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Name of the part.
      - name: manufacturer
        description: Manufacturer of the part.
      - name: brand
        description: Brand of the part.
      - name: type
        description: Part type, including material classification.
      - name: size
        description: Size of the part.
      - name: container
        description: Container used for the part.
      - name: retail_price
        description: '{{ doc("retail_price") }}'
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_tpch_regions
    description: One row per region from the TPCH source, serving as the top-level geography lookup for nation, customer, and supplier rollups.
    columns:
      - name: region_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Region name.
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_tpch_suppliers
    description: One row per supplier from the TPCH source with renamed fields used by supplier and order-item marts.
    columns:
      - name: supplier_key
        description: Primary key of the model.
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        description: '{{ doc("supplier_name") }}'
      - name: supplier_address
        description: '{{ doc("supplier_address") }}'
      - name: nation_key
        description: Foreign key to `stg_tpch_nations`.
      - name: phone_number
        description: '{{ doc("phone_number") }}'
      - name: account_balance
        description: '{{ doc("account_balance") }}'
      - name: comment
        description: '{{ doc("comment") }}'

  - name: stg_movie_reviews__raw_movie_reviews
    description: One row per raw movie review ingested from the `movie_reviews.raw_movie_reviews` source with fields renamed and passed through for downstream sentiment analysis or quality checks.
    columns:
      - name: review_text
        description: Free-text review submitted for the movie.
      - name: sentiment_value
        description: Sentiment score or label associated with the review.
      - name: id
        description: Unique identifier for the review record.
      - name: movie_id
        description: Identifier of the reviewed movie.
      - name: response_time
        description: Time taken to capture or respond to the review event.
