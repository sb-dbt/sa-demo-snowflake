version: 2

models:
  - name: agg_ship_modes_hardcoded_pivot
    description: One row per order year with ship modes pivoted into separate columns. This is a demo aggregate showing a hardcoded Snowflake pivot pattern over order shipment data.
    columns:
      - name: order_year
        description: Calendar year of the order.
  
  - name: top_customers
    description: Customer ranking output ordered by lifetime value from the latest customer dimension version. Use this model for quick analysis of highest-value customers without re-deriving the ranking logic.
    columns:
      - name: customer_key
        description: Unique identifier for each customer.
        data_tests:
          - unique
          - not_null

  - name: supplier_sales_by_year
    description: One row per supplier and year with annual sales rolled up for trend analysis and supplier performance reporting.
    columns:
      - name: supplier_name
        description: Supplier included in the yearly sales rollup.
        data_tests:
          - not_null
  
  - name: agg_daily_returned_orders
    description: One row per day summarizing returned-order activity so return volume can be tracked at a daily grain.

  - name: agg_returned_orders_by_month
    description: One row per month summarizing returned orders and return rate, used by downstream dashboards monitoring return trends over time.
    columns:
      - name: order_month
        description: Month in which the orders were placed.
      - name: returned_orders
        description: Total number of returned orders in the month.
      - name: return_rate
        description: Share of orders returned out of total orders placed in the month.
      - name: row_count
        description: Number of rows contributing to the monthly aggregation.

exposures:
  - name: returned_orders
    type: dashboard
    maturity: high
    url: https://fishtown.looker.com/dashboards/606
    description: 
      How is our return rate trending over time?

    depends_on:
      - ref('agg_returned_orders_by_month')

    owner:
      name: Alex 
      email: alex.dinsmoor@dbtlabs.com 


  - name: active_orders
    type: dashboard
    maturity: high
    url: https://fishtown.looker.com/dashboards/493
    description: 
      Did someone say "exponential growth"?
    
    depends_on:
      - ref('fct_orders')
      - ref('dim_suppliers')
      
    owner:
      name: Isabela 
      email: isabela@dbtlabs.com

  - name: business_pulse
    type: dashboard
    maturity: high
    url: https://public.tableau.com/app/profile/mike.burke2608/viz/BDLDemo/BusinessPulse_1
    description: 
      Business Pulse for use by anyone looking to get insights on orders. 
    
    depends_on:
      - ref('fct_orders')
      - ref('dim_suppliers')
      - ref('dim_customers')

    owner:
      name: Business Operations Team 
      email: bizops@dbtlabs.com

  - name: yearly_part_rollup
    description: Rollup of orders
    type: dashboard 
    url: https://example.com
    maturity: high
    owner:
      name: DBT User Bob
      email: dbtuserbob@getdbt.com
    depends_on:
        - ref('agg_ship_modes_hardcoded_pivot')
