version: 2

models:
  - name: order_items
    description: One row per order item, enriched with order context and derived pricing measures used downstream in the fact layer. This is the working model where base price, discounts, tax, and net sales are calculated before publishing `fct_order_items`.
    columns:
      - name: order_item_key
        description: '{{ doc("order_item_key") }}'
        data_tests:
          - unique
          - not_null
      - name: order_key
        description: Foreign key to the order that contains the line item.
      - name: customer_key
        description: Foreign key to the customer who placed the order.
      - name: part_key
        description: Foreign key to the ordered part.
      - name: supplier_key
        description: Foreign key to the supplier fulfilling the line item.
      - name: order_date
        description: Date the order was placed.
      - name: order_status_code
        description: Status code from the parent order.
      - name: return_flag
        description: '{{ doc("return_flag") }}'
      - name: line_number
        description: '{{ doc("line_number") }}'
      - name: order_item_status_code
        description: Status code for the line item shipment lifecycle.
      - name: ship_date
        description: '{{ doc("ship_date") }}'
      - name: commit_date
        description: '{{ doc("commit_date") }}'
      - name: receipt_date
        description: '{{ doc("receipt_date") }}'
      - name: ship_mode
        description: '{{ doc("ship_mode") }}'
      - name: extended_price
        description: '{{ doc("extended_price") }}'
      - name: quantity
        description: Number of units included in the line item.
      - name: base_price
        description: '{{ doc("base_price") }}'
      - name: discount_percentage
        description: '{{ doc("discount_percentage") }}'
      - name: discounted_price
        description: '{{ doc("discounted_price") }}'
      - name: gross_item_sales_amount
        description: '{{ doc("gross_item_sales_amount") }}'
      - name: discounted_item_sales_amount
        description: '{{ doc("discounted_item_sales_amount") }}'
      - name: item_discount_amount
        description: '{{ doc("item_discount_amount") }}'
      - name: tax_rate
        description: '{{ doc("tax_rate") }}'
      - name: item_tax_amount
        description: Tax amount calculated at the order item level after discount.
      - name: net_item_sales_amount
        description: '{{ doc("net_item_sales_amount") }}'
    config:
      tags:
        - output_table_type|orders

  - name: part_suppliers
    description: One row per part and supplier combination, joining the staging part, supplier, and part-supplier records into a single lookup used by downstream marts.
    columns:
      - name: part_supplier_key
        description: Surrogate key for the part and supplier combination.
        data_tests:
          - unique
          - not_null
      - name: part_key
        description: Foreign key to the part.
      - name: part_name
        description: Business name of the part.
      - name: manufacturer
        description: Manufacturer associated with the part.
      - name: brand
        description: Brand associated with the part.
      - name: part_type
        description: Part type, including material classification.
      - name: part_size
        description: Size attribute of the part.
      - name: container
        description: Packaging container for the part.
      - name: retail_price
        description: '{{ doc("retail_price") }}'
      - name: supplier_key
        description: Foreign key to the supplier.
      - name: supplier_name
        description: '{{ doc("supplier_name") }}'
      - name: supplier_address
        description: '{{ doc("supplier_address") }}'
      - name: phone_number
        description: '{{ doc("phone_number") }}'
      - name: account_balance
        description: '{{ doc("account_balance") }}'
      - name: nation_key
        description: Foreign key to the supplier's nation.
      - name: available_quantity
        description: '{{ doc("available_quantity") }}'
      - name: cost
        description: '{{ doc("cost") }}'

  - name: customer_tier
    description: One row per customer with a lifetime value rollup and a coarse tier assignment derived from historical order revenue.
    columns:
      - name: customer_key
        description: Primary key for the customer.
        data_tests:
          - unique
      - name: lifetime_value
        description: Sum of `total_price` across all orders for the customer.
      - name: tier_name
        description: Revenue tier assigned from the customer's lifetime value.

  - name: customer_flags
    description: One row per customer with lifetime value and boolean-style Y/N flags for high-, mid-, and low-value customer segments. This model feeds the latest customer dimension version.
    columns:
      - name: customer_key
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null
      - name: lifetime_value
        description: Sum of `total_price` across all orders for the customer.
      - name: is_high_value
        description: '`Y` when lifetime value exceeds 3,000,000; otherwise `N`.'

      - name: is_mid_value
        description: '`Y` when lifetime value is between 1,000,000 and 2,999,999; otherwise `N`.'

      - name: is_low_value
        description: '`Y` when lifetime value is below 1,000,000; otherwise `N`.'

